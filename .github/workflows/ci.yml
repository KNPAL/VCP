name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vcp
          POSTGRES_PASSWORD: ephemeral-ci-fixture
          POSTGRES_DB: vcp_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U vcp -d vcp_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://vcp:ephemeral-ci-fixture@127.0.0.1:55432/vcp_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 56379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vcp/database generate
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @vcp/database migrate
      - name: Seed the disposable integration owner
        run: |
          printf '%s' synthetic-test-password-2026 > "$RUNNER_TEMP/vcp-owner"
          OWNER_LOGIN=integration-owner OWNER_PASSWORD_FILE="$RUNNER_TEMP/vcp-owner" node packages/database/dist/seed.js
      - run: pnpm test:integration
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/vcp-browser" playwright@1.62.1
          "$RUNNER_TEMP/vcp-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify authenticated broker setup and download journeys
        run: |
          mkdir -p .runtime
          VCP_PLAYWRIGHT_MODULE="$RUNNER_TEMP/vcp-browser/node_modules/playwright/index.mjs" VCP_BROWSER_CHANNEL=chromium node scripts/ci-broker-ui.mjs

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Boot the isolated TLS stack from a clean checkout
        run: |
          node scripts/init-local.mjs
          # Compose file-backed secrets retain host permissions. These files exist
          # only on this disposable runner, inside an owner-only directory.
          chmod 700 .runtime
          chmod 444 .runtime/database-password .runtime/owner-password
          docker compose -p vcp-ci-smoke -f infra/compose.yml -f infra/compose.app.yml up --build --wait --wait-timeout 180
      - name: Verify TLS, authentication, database and worker health
        run: |
          stack=(docker compose -p vcp-ci-smoke -f infra/compose.yml -f infra/compose.app.yml)
          "${stack[@]}" exec -T proxy curl --silent --show-error --fail --cacert /data/caddy/pki/authorities/local/root.crt https://localhost:8443/login > /dev/null
          status=$("${stack[@]}" exec -T proxy curl --silent --output /dev/null --write-out '%{http_code}' --cacert /data/caddy/pki/authorities/local/root.crt https://localhost:8443/api/v1/auth/session)
          test "$status" = 401
          "${stack[@]}" exec -T postgres pg_isready -U vcp -d vcp
          "${stack[@]}" exec -T redis redis-cli ping | grep -qx PONG
          "${stack[@]}" exec -T worker node -e "process.exit(Date.now()-require('fs').statSync('/tmp/vcp-worker-health').mtimeMs < 20000 ? 0 : 1)"
          VCP_SMOKE_PROJECT=vcp-ci-smoke node scripts/ci-compose-auth.mjs
      - name: Remove disposable CI services
        if: always()
        run: docker compose -p vcp-ci-smoke -f infra/compose.yml -f infra/compose.app.yml down --volumes
